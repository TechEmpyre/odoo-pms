[options]

; Master password
admin_passwd = admin

; PostgreSQL
db_host = aj2bw2o3sd2bt46ogq2b7jfk
db_port = 5432
db_user = odoo
db_password = StrongPassword123!

; Database filtering (optional)
dbfilter = .*

; Addons
addons_path =
    /opt/odoo/addons,
    /opt/enterprise,
    /opt/custom_addons

; Data directory
data_dir = /var/lib/odoo

; Network
http_interface = 0.0.0.0
http_port = 8069

; Reverse proxy
proxy_mode = True

; Workers
workers = 4
max_cron_threads = 2

; Limits
limit_time_cpu = 600
limit_time_real = 1200

; Logging
log_level = info
